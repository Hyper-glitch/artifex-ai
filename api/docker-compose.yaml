services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - PYTHONPATH=/opt/app/src
    ports:
      - "8080:8080"
    volumes:
      - ./src:/src
    depends_on:
      - database
      - rabbitmq
    restart: always
    networks:
      - app_network

#  web-proxy:
#    image: nginx:latest
#    volumes:
#      - ./nginx.conf:/etc/nginx/nginx.conf:ro
#    depends_on:
#      - app
#    ports:
#      - "80:80"
#      - "443:443"
#    restart: always
#    networks:
#      - app_network

  rabbitmq:
    image: rabbitmq:management
    env_file:
      - .env
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: postgres:latest
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    networks:
      - app_network

