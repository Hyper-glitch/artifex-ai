services:
  tg-bot:
    build:
      context: tg-bot
      dockerfile: Dockerfile
    env_file:
      - tg-bot/.env
    environment:
      - PYTHONPATH=/opt/app/src
    volumes:
      - ./src:/src
    depends_on:
      - api
    restart: always
    networks:
      - app_network

  api:
    build:
      context: api
      dockerfile: Dockerfile
    env_file:
      - api/.env
    environment:
      - PYTHONPATH=/opt/app/src
    ports:
      - "8080:8080"
    volumes:
      - ./src:/src
    depends_on:
      - database
      - rabbitmq
    restart: always
    networks:
      - app_network

  worker:
    build:
      context: worker
      dockerfile: Dockerfile
    env_file:
      - worker/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always
    environment:
      - PYTHONPATH=/opt/app/src
    networks:
      - app_network

  web-proxy:
    image: nginx:latest
    volumes:
      - ./api/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    restart: always
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:management
    env_file:
      - api/.env
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: postgres:latest
    env_file:
      - api/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    ports:
      - "5432:5432"
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
